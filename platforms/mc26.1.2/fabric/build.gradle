plugins {
    alias(libs.plugins.fabric.loom)
}
apply from: file('../../../gradle/quilt-runtime.gradle')

group = 'stonytark'
version = '1.0.0'
def artifactVersion = version.toString()
def runtimeLoader = providers.gradleProperty('cinemarrRuntimeLoader').orElse('fabric')
def quiltRuntime = runtimeLoader.map { it == 'quilt' }
def fabricLoaderVersion = providers.gradleProperty('cinemarrFabricLoaderVersion').orElse(libs.versions.fabric.loader)
def includeModMenu = providers.gradleProperty('cinemarrIncludeModMenu').map { it.toBoolean() }.orElse(false)
def quiltRuntimeLibraries = cinemarrQuiltRuntimeProfiles[libs.versions.quilt.loader.get()]
def quiltClassPathGroup = [
        layout.buildDirectory.dir('classes/java/main').get().asFile,
        layout.buildDirectory.dir('resources/main').get().asFile,
        project(':core').layout.buildDirectory.dir('classes/java/main').get().asFile,
        project(':core').layout.buildDirectory.dir('resources/main').get().asFile
].join(File.pathSeparator)
if (!(runtimeLoader.get() in ['fabric', 'quilt'])) {
    throw new GradleException("Unsupported Cinemarr runtime loader: ${runtimeLoader.get()}")
}

base {
    archivesName = "cinemarr-${project.version}+mc26.1.2-fabric"
}

loom {
    runs {
        server {
            if (quiltRuntime.get()) {
                property 'fabric.dli.main', 'org.quiltmc.loader.impl.launch.knot.KnotServer'
                property 'loader.development', 'true'
                property 'loader.remapClasspathFile', file('.gradle/loom-cache/remapClasspath.txt').absolutePath
                property 'loader.classPathGroups', quiltClassPathGroup
            }
            if (providers.gradleProperty('cinemarrServerGameDir').isPresent()) {
                runDir providers.gradleProperty('cinemarrServerGameDir').get()
            }
        }
        client {
            if (quiltRuntime.get()) {
                property 'fabric.dli.main', 'org.quiltmc.loader.impl.launch.knot.KnotClient'
                property 'loader.development', 'true'
                property 'loader.remapClasspathFile', file('.gradle/loom-cache/remapClasspath.txt').absolutePath
                property 'loader.classPathGroups', quiltClassPathGroup
            }
            if (providers.gradleProperty('cinemarrAcceptanceServer').isPresent()) {
                runDir providers.gradleProperty('cinemarrAcceptanceGameDir').get()
                programArgs '--username', providers.gradleProperty('cinemarrAcceptanceUsername').get(),
                        '--quickPlayMultiplayer', providers.gradleProperty('cinemarrAcceptanceServer').get()
            }
        }
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(libs.versions.java.get().toInteger())
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.quiltmc.org/repository/release/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

configurations { javacvFacade }
def extractJavaCvFacade = tasks.register('extractJavaCvFacade', Sync) {
    from { configurations.javacvFacade.collect { zipTree(it) } }
    include 'org/bytedeco/javacv/Frame.class', 'org/bytedeco/javacv/Frame$*.class',
            'org/bytedeco/javacv/FrameGrabber.class', 'org/bytedeco/javacv/FrameGrabber$*.class',
            'org/bytedeco/javacv/FFmpegFrameGrabber.class', 'org/bytedeco/javacv/FFmpegFrameGrabber$*.class',
            'org/bytedeco/javacv/FFmpegLogCallback.class'
    into(layout.buildDirectory.dir('generated/javacvFacade'))
}
sourceSets.main.output.dir(extractJavaCvFacade)

dependencies {
    def javaCppVersion = '1.5.14'
    def ffmpegVersion = '8.1.2-1.5.14'
    def javaCvVersion = '1.5.14'
    minecraft "com.mojang:minecraft:${libs.versions.minecraft.get()}"
    implementation quiltRuntime.get() ? libs.quilt.loader : "net.fabricmc:fabric-loader:${fabricLoaderVersion.get()}"
    if (quiltRuntime.get()) quiltRuntimeLibraries.each { implementation it }
    implementation libs.fabric.api
    compileOnly libs.modmenu
    if (includeModMenu.get()) runtimeOnly(libs.modmenu) {
        exclude group: 'net.fabricmc', module: 'fabric-loader'
    }

    implementation project(':core')
    include project(':core')
    implementation libs.jlayer
    include libs.jlayer
    implementation libs.jump3r
    include libs.jump3r
    javacvFacade("org.bytedeco:javacv:${javaCvVersion}") { transitive = false }
    compileOnly("org.bytedeco:javacv:${javaCvVersion}") { transitive = false }
    implementation("org.bytedeco:javacpp:${javaCppVersion}") { transitive = false }
    include("org.bytedeco:javacpp:${javaCppVersion}") { transitive = false }
    implementation("org.bytedeco:ffmpeg:${ffmpegVersion}") { transitive = false }
    include("org.bytedeco:ffmpeg:${ffmpegVersion}") { transitive = false }
    ['linux-x86_64', 'linux-arm64', 'windows-x86_64'].each { platform ->
        implementation("org.bytedeco:javacpp:${javaCppVersion}:${platform}") { transitive = false }
        include("org.bytedeco:javacpp:${javaCppVersion}:${platform}") { transitive = false }
        implementation("org.bytedeco:ffmpeg:${ffmpegVersion}:${platform}") { transitive = false }
        include("org.bytedeco:ffmpeg:${ffmpegVersion}:${platform}") { transitive = false }
    }
    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.launcher
}

dependencyLocking { lockAllConfigurations() }
if (quiltRuntime.get()) {
    configurations.configureEach {
        resolutionStrategy.deactivateDependencyLocking()
        quiltRuntimeLibraries.each { dependency -> resolutionStrategy.force(dependency) }
    }
}

sourceSets {
    main {
        java {
            setSrcDirs([file('../../../src/main/java'), file('../common/src/main'), file('src/main')])
            exclude 'stonytark/cinemarr/Cinemarr.java'
            exclude 'stonytark/cinemarr/client/CinemarrClient.java'
            exclude 'stonytark/cinemarr/client/CinemarrClientConfigScreen.java'
            exclude 'stonytark/cinemarr/client/CinemarrClientState.java'
            exclude 'stonytark/cinemarr/client/CinemarrScreen.java'
            exclude 'stonytark/cinemarr/client/CinemarrVideoScreen.java'
            exclude 'stonytark/cinemarr/client/CinemarrVideoAudio.java'
            exclude 'stonytark/cinemarr/client/CinemarrVideoAudioManager.java'
            exclude 'stonytark/cinemarr/client/CinemarrVideoTexture.java'
            exclude 'stonytark/cinemarr/client/CinemarrVideoRenderer.java'
            exclude 'stonytark/cinemarr/client/VideoResourceLocations.java'
            exclude 'stonytark/cinemarr/config/CinemarrConfig.java'
            exclude 'stonytark/cinemarr/gametest/**'
            exclude 'stonytark/cinemarr/network/CinemarrNetwork.java'
            exclude 'stonytark/cinemarr/network/CinemarrPayloads.java'
            exclude 'stonytark/cinemarr/network/VideoPayloads.java'
            exclude 'stonytark/cinemarr/server/CinemarrCommands.java'
            exclude 'stonytark/cinemarr/server/CinemarrPermissions.java'
            exclude 'stonytark/cinemarr/server/CinemarrServer.java'
            exclude 'stonytark/cinemarr/server/CinemarrSavedData.java'
            exclude 'stonytark/cinemarr/server/QueueTrackCodec.java'
            exclude 'stonytark/cinemarr/server/StationDefinition.java'
            exclude 'stonytark/cinemarr/server/CinemarrVideoSavedData.java'
            exclude 'stonytark/cinemarr/server/ServerVideoManager.java'
            exclude 'stonytark/cinemarr/screen/CinemarrWorldScreens.java'
            exclude 'stonytark/cinemarr/screen/ScreenPixelBlock.java'
            exclude 'stonytark/cinemarr/screen/TvControllerBlock.java'
            exclude 'stonytark/cinemarr/registry/CinemarrBlocks.java'
            exclude 'stonytark/cinemarr/registry/CinemarrItems.java'
        }
        resources {
            srcDir file('../../../src/main/resources')
            exclude 'META-INF/neoforge.mods.toml'
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
sourceSets.test.java.srcDir(file('../../../test-fixtures/java/mc26.1.2'))
sourceSets.test.resources { srcDir file('../../../test-fixtures'); exclude 'java/**' }
tasks.withType(Test).configureEach { useJUnitPlatform() }

tasks.named('processResources') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property 'version', artifactVersion
    filesMatching('fabric.mod.json') { expand version: artifactVersion }
    filesMatching('cinemarr.mixins.json') {
        filter {
            it.replace('"JAVA_21"', '"JAVA_25"')
                    .replace('"mixins": [', '"mixins": [\n    "QuiltServerBootstrapMixin"')
                    .replace('"client": [', '"client": [\n    "client.QuiltClientBootstrapMixin",')
        }
    }
}
tasks.named('sourcesJar') { duplicatesStrategy = DuplicatesStrategy.EXCLUDE }

tasks.named('jar', Jar) {
    archiveFileName = "cinemarr-${project.version}+mc26.1.2-fabric.jar"
    from('../../../THIRD_PARTY_NOTICES.md') { into('META-INF') }
    from('../../../LICENSE') {
        into('META-INF')
        rename { 'LICENSE-Cinemarr-CC0-1.0.txt' }
    }
    from('../../../LICENSE-LGPL-2.1-or-later.txt') { into('META-INF') }
}

def releaseArchive = tasks.named('jar', Jar).flatMap { it.archiveFile }
def expectedReleaseName = "cinemarr-${artifactVersion}+mc26.1.2-fabric.jar"
def releaseEntries = ['META-INF/jars/core-1.0.0.jar', 'META-INF/jars/jlayer-1.0.1.jar',
                      'META-INF/jars/jump3r-1.0.5.jar', 'META-INF/LICENSE-Cinemarr-CC0-1.0.txt',
                      'META-INF/jars/javacpp-1.5.14.jar', 'META-INF/jars/ffmpeg-8.1.2-1.5.14.jar',
                      'META-INF/jars/javacpp-1.5.14-linux-x86_64.jar', 'META-INF/jars/javacpp-1.5.14-linux-arm64.jar',
                      'META-INF/jars/javacpp-1.5.14-windows-x86_64.jar', 'META-INF/jars/ffmpeg-8.1.2-1.5.14-linux-x86_64.jar',
                      'META-INF/jars/ffmpeg-8.1.2-1.5.14-linux-arm64.jar', 'META-INF/jars/ffmpeg-8.1.2-1.5.14-windows-x86_64.jar',
                      'org/bytedeco/javacv/FFmpegFrameGrabber.class', 'org/bytedeco/javacv/Frame.class',
                      'META-INF/LICENSE-LGPL-2.1-or-later.txt', 'META-INF/THIRD_PARTY_NOTICES.md',
                      'fabric.mod.json', 'cinemarr.mixins.json', 'cinemarr.png',
                      'assets/cinemarr/lang/en_us.json', 'stonytark/cinemarr/Cinemarr.class',
                      'stonytark/cinemarr/client/CinemarrClient.class',
                      'stonytark/cinemarr/client/CinemarrModMenu.class',
                      'stonytark/cinemarr/network/CinemarrNetwork.class']

tasks.register('verifyRelease') {
    group = 'verification'
    dependsOn(tasks.named('build'))
    doLast {
        def archive = releaseArchive.get().asFile
        if (archive.name != expectedReleaseName) {
            throw new GradleException("Unexpected release filename: ${archive.name}")
        }
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            def found = zip.entries().collect { it.name } as Set
            releaseEntries.each { entry ->
                if (!found.contains(entry)) throw new GradleException("Release archive is missing ${entry}")
            }
            def metadata = new groovy.json.JsonSlurper().parseText(
                    zip.getInputStream(zip.getEntry('fabric.mod.json')).getText('UTF-8'))
            if (metadata.id != 'cinemarr' || metadata.depends.minecraft != '~26.1.2'
                    || metadata.depends.java != '>=25' || metadata.depends.fabricloader != '>=0.19.2') {
                throw new GradleException('Fabric metadata does not identify the expected mod, Minecraft, and Java versions')
            }
            if (!zip.getInputStream(zip.getEntry('cinemarr.mixins.json')).getText('UTF-8').contains('"JAVA_25"')) {
                throw new GradleException('Fabric 26.1.2 mixin metadata does not target Java 25')
            }
            byte[] platformHeader = zip.getInputStream(zip.getEntry('stonytark/cinemarr/Cinemarr.class')).readNBytes(8)
            int platformMajor = ((platformHeader[6] & 0xff) << 8) | (platformHeader[7] & 0xff)
            if (platformMajor != 69) throw new GradleException("Fabric platform classes are not Java 25 bytecode: class major ${platformMajor}")
            new java.util.zip.ZipInputStream(zip.getInputStream(zip.getEntry('META-INF/jars/core-1.0.0.jar'))).withCloseable { nested ->
                boolean foundCoreClass = false
                for (def entry = nested.nextEntry; entry != null; entry = nested.nextEntry) {
                    if (entry.name == 'stonytark/cinemarr/core/server/ChunkTransferPolicy.class') {
                        byte[] header = nested.readNBytes(8)
                        int major = ((header[6] & 0xff) << 8) | (header[7] & 0xff)
                        if (major != 52) throw new GradleException("Shared core is not Java 8 bytecode: class major ${major}")
                        foundCoreClass = true
                    }
                }
                if (!foundCoreClass) throw new GradleException('Release archive does not contain the shared transport core')
            }
        }
    }
}
