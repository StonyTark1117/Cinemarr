plugins {
    id 'java-library'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.3'
}

allprojects { apply from: rootProject.file('../../../gradle/reproducible-archives.gradle') }

def modVersionValue = providers.gradleProperty('mod_version').get()
def minecraftVersionValue = providers.gradleProperty('minecraft_version').get()

group = 'stonytark'
version = modVersionValue

java {
    toolchain.languageVersion = JavaLanguageVersion.of(8)
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

minecraft {
    mcVersion.set(minecraftVersionValue)
    javaCompatibilityVersion.set(8)
    jvmLanguageVersion.set(JavaLanguageVersion.of(8))
    username.set('CinemarrDeveloper')
    extraRunJvmArguments.add('-ea:stonytark.cinemarr')
}

def acceptanceServer = providers.gradleProperty('cinemarrAcceptanceServer').orNull
def acceptanceUsername = providers.gradleProperty('cinemarrAcceptanceUsername').orNull
def acceptanceGameDir = providers.gradleProperty('cinemarrAcceptanceGameDir').orNull
def acceptanceWidth = providers.gradleProperty('cinemarrAcceptanceWidth').orNull
def acceptanceHeight = providers.gradleProperty('cinemarrAcceptanceHeight').orNull

tasks.named('runClient') {
    if (acceptanceUsername != null) username.set(acceptanceUsername)
    if (acceptanceGameDir != null) workingDir(file(acceptanceGameDir))
    if (acceptanceWidth != null && acceptanceHeight != null) {
        extraArgs.addAll(['--width', acceptanceWidth, '--height', acceptanceHeight])
    }
    if (acceptanceServer != null) {
        int separator = acceptanceServer.lastIndexOf(':')
        if (separator <= 0 || separator == acceptanceServer.length() - 1) {
            throw new GradleException('cinemarrAcceptanceServer must use host:port syntax')
        }
        String host = acceptanceServer.substring(0, separator)
        String port = acceptanceServer.substring(separator + 1)
        extraArgs.addAll(['--server', host, '--port', port])
    }
}

repositories {
    mavenCentral()
}

configurations {
    embeddedLibraries
    javacvFacade
    implementation.extendsFrom(embeddedLibraries)
}

def extractJavaCvFacade = tasks.register('extractJavaCvFacade', Sync) {
    from { configurations.javacvFacade.collect { zipTree(it) } }
    include 'org/bytedeco/javacv/Frame.class', 'org/bytedeco/javacv/Frame$*.class',
            'org/bytedeco/javacv/FrameGrabber.class', 'org/bytedeco/javacv/FrameGrabber$*.class',
            'org/bytedeco/javacv/FFmpegFrameGrabber.class', 'org/bytedeco/javacv/FFmpegFrameGrabber$*.class',
            'org/bytedeco/javacv/FFmpegLogCallback.class'
    into(layout.buildDirectory.dir('generated/javacvFacade'))
}
sourceSets.main.output.dir(extractJavaCvFacade)

dependencyLocking {
    lockAllConfigurations()
}

dependencies {
    def javaCppVersion = '1.5.14'
    def ffmpegVersion = '8.1.2-1.5.14'
    def javaCvVersion = '1.5.14'
    javacvFacade("org.bytedeco:javacv:${javaCvVersion}") { transitive = false }
    compileOnly("org.bytedeco:javacv:${javaCvVersion}") { transitive = false }
    embeddedLibraries("org.bytedeco:javacpp:${javaCppVersion}") { transitive = false }
    embeddedLibraries("org.bytedeco:ffmpeg:${ffmpegVersion}") { transitive = false }
    ['linux-x86_64', 'linux-arm64', 'windows-x86_64'].each { platform ->
        embeddedLibraries(group: 'org.bytedeco', name: 'javacpp', version: javaCppVersion, classifier: platform) { transitive = false }
        embeddedLibraries(group: 'org.bytedeco', name: 'ffmpeg', version: ffmpegVersion, classifier: platform) { transitive = false }
    }
    testImplementation(platform('org.junit:junit-bom:5.10.2'))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', '../../../core/src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources', '../../../src/main/resources']
            exclude 'cinemarr.mixins.json'
        }
    }
    test {
        java.srcDirs = ['src/test/java', '../../../core/src/test/java']
        resources {
            srcDir '../../../test-fixtures'
            exclude 'java/**'
        }
    }
}

def sharedHardwareDecoder = objects.sourceDirectorySet('sharedHardwareDecoder', 'shared hardware decoder')
sharedHardwareDecoder.srcDir('../../../src/main/java')
sharedHardwareDecoder.include('stonytark/cinemarr/client/FfmpegHardwareVideoDecoder.java')
sourceSets.main.java.source(sharedHardwareDecoder)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    inputs.property('cinemarrLiveTestEnabled', providers.environmentVariable('CINEMARR_LIVE_TEST').orElse('false'))
    outputs.upToDateWhen { System.getenv('CINEMARR_LIVE_TEST') != 'true' }
    outputs.cacheIf('credentialed Plex integration tests must execute live') {
        System.getenv('CINEMARR_LIVE_TEST') != 'true'
    }
}

def canonicalBaseName = "cinemarr-${modVersionValue}+mc${minecraftVersionValue}-forge"

tasks.named('processResources', ProcessResources) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property('modVersion', modVersionValue)
    filesMatching('mcmod.info') {
        expand(modVersion: modVersionValue)
    }
}

tasks.named('jar', Jar) {
    archiveBaseName.set(canonicalBaseName)
    archiveVersion.set('')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.embeddedLibraries.collect { zipTree(it) }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/INDEX.LIST', 'module-info.class'
    from('../../../LICENSE') {
        into 'META-INF'
        rename { 'LICENSE-Cinemarr-CC0-1.0.txt' }
    }
    from('../../../LICENSE-LGPL-2.1-or-later.txt') {
        into 'META-INF'
    }
    from('../../../THIRD_PARTY_NOTICES.md') {
        into 'META-INF'
    }
    manifest.attributes(
            'FMLCorePluginContainsFMLMod': 'true',
            'Implementation-Title': 'Cinemarr',
            'Implementation-Version': modVersionValue
    )
}

tasks.named('reobfJar') {
    archiveBaseName.set(canonicalBaseName)
    archiveVersion.set('')
}

def releaseArchive = tasks.named('reobfJar').flatMap { it.archiveFile }
tasks.register('verifyRelease') {
    dependsOn(tasks.named('test'), tasks.named('reobfJar'))
    inputs.file(releaseArchive)
    doLast {
        File archive = releaseArchive.get().asFile
        if (archive.name != "${canonicalBaseName}.jar") {
            throw new GradleException("Unexpected legacy artifact name: ${archive.name}")
        }
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            Set<String> found = zip.entries().collect { it.name } as Set
            [
                    'mcmod.info',
                    'assets/cinemarr/lang/en_us.json',
                    'assets/cinemarr/lang/en_US.lang',
                    'cinemarr.png',
                    'META-INF/LICENSE-Cinemarr-CC0-1.0.txt',
                    'META-INF/LICENSE-LGPL-2.1-or-later.txt',
                    'META-INF/THIRD_PARTY_NOTICES.md',
                    'stonytark/cinemarr/Cinemarr.class',
                    'stonytark/cinemarr/core/server/ChunkTransferPolicy.class',
                    'stonytark/cinemarr/network/LegacyNetwork.class',
                    'stonytark/cinemarr/server/LegacyVideoManager.class',
                    'stonytark/cinemarr/server/LegacyVideoSavedData.class',
                    'stonytark/cinemarr/client/LegacyFfmpegVideoDecoder.class',
                    'stonytark/cinemarr/client/FfmpegHardwareVideoDecoder.class',
                    'stonytark/cinemarr/client/LegacyVideoPlayback.class',
                    'stonytark/cinemarr/client/LegacyVideoRenderer.class',
                    'stonytark/cinemarr/client/LegacyVideoAudio.class',
                    'stonytark/cinemarr/client/LegacyVideoScreen.class',
                    'stonytark/cinemarr/screen/LegacyWorldScreens.class',
                    'stonytark/cinemarr/screen/LegacyScreenPixelBlock.class',
                    'stonytark/cinemarr/screen/LegacyTvControllerBlock.class',
                    'org/bytedeco/javacv/FFmpegFrameGrabber.class',
                    'org/bytedeco/ffmpeg/global/avcodec.class'
            ].each { entry ->
                if (!found.contains(entry)) {
                    throw new GradleException("Legacy release archive is missing ${entry}")
                }
            }
            found.findAll { it.startsWith('stonytark/cinemarr/') && it.endsWith('.class') }.each { entry ->
                InputStream stream = zip.getInputStream(zip.getEntry(entry))
                byte[] header = new byte[8]
                if (stream.read(header) != header.length) {
                    throw new GradleException("Unable to inspect ${entry}")
                }
                stream.close()
                int major = ((header[6] & 0xff) << 8) | (header[7] & 0xff)
                if (major != 52) {
                    throw new GradleException("Legacy release contains non-Java-8 bytecode: ${entry} has class major ${major}")
                }
            }
            String metadata = zip.getInputStream(zip.getEntry('mcmod.info')).getText('UTF-8')
            [
                    '"modid": "cinemarr"',
                    '"version": "1.0.0"',
                    '"mcversion": "1.7.10"'
            ].each { required ->
                if (!metadata.contains(required)) throw new GradleException("Legacy metadata is missing ${required}")
            }
            if (found.contains('cinemarr.mixins.json')) {
                throw new GradleException('Legacy release must not contain modern Mixin metadata')
            }
            if (metadata.toLowerCase(Locale.ROOT).contains('pampmod')) {
                throw new GradleException('Legacy metadata contains the retired PAmpMod identifier')
            }
        }
    }
}
