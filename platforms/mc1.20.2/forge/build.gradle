plugins {
    id 'java'
    alias(libs.plugins.forgegradle)
}

group = 'stonytark'
version = '1.0.0'
def artifactVersion = version.toString()
def expectedReleaseName = "cinemarr-${artifactVersion}+mc1.20.2-forge.jar"
base { archivesName = "cinemarr-${artifactVersion}+mc1.20.2-forge" }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(libs.versions.java.get().toInteger())
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}

minecraft {
    mappings channel: 'official', version: libs.versions.minecraft.get()
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            buildAllProjects true
            mods {
                cinemarr {
                    source sourceSets.main
                }
            }
        }
        client {
            args '--mixin.config', 'cinemarr.mixins.json'
            if (providers.gradleProperty('cinemarrAcceptanceServer').isPresent()) {
                workingDirectory file(providers.gradleProperty('cinemarrAcceptanceGameDir').get())
                args '--username', providers.gradleProperty('cinemarrAcceptanceUsername').get(),
                        '--quickPlayMultiplayer', providers.gradleProperty('cinemarrAcceptanceServer').get()
            }
        }
        server { args '--nogui' }
    }
}

repositories { mavenCentral() }

configurations {
    javacvFacade
    bundledNatives
}
def extractJavaCvFacade = tasks.register('extractJavaCvFacade', Sync) {
    from { configurations.javacvFacade.collect { zipTree(it) } }
    include 'org/bytedeco/javacv/Frame.class', 'org/bytedeco/javacv/Frame$*.class', 'org/bytedeco/javacv/FrameGrabber.class', 'org/bytedeco/javacv/FrameGrabber$*.class', 'org/bytedeco/javacv/FFmpegFrameGrabber.class', 'org/bytedeco/javacv/FFmpegFrameGrabber$*.class', 'org/bytedeco/javacv/FFmpegLogCallback.class'
    into(layout.buildDirectory.dir('generated/javacvFacade'))
}
def installJavaCvFacade = tasks.register('installJavaCvFacade', Copy) {
    dependsOn(extractJavaCvFacade)
    from(layout.buildDirectory.dir('generated/javacvFacade'))
    into(layout.buildDirectory.dir('classes/java/main'))
    mustRunAfter(tasks.named('compileJava'))
}
tasks.named('classes') { dependsOn(installJavaCvFacade) }

jarJar.enable()

dependencies {
    def javaCppVersion='1.5.14',ffmpegVersion='8.1.2-1.5.14',javaCvVersion='1.5.14'
    minecraft "net.minecraftforge:forge:${libs.versions.minecraft.get()}-${libs.versions.forge.loader.get()}"
    implementation project(':core')
    jarJar(project(':core')) { dependency -> jarJar.ranged(dependency, '[1.0.0,1.0.1)') }
    implementation libs.jlayer
    minecraftLibrary libs.jlayer
    jarJar(libs.jlayer) { dependency -> jarJar.ranged(dependency, '[1.0.1,1.0.2)') }
    implementation libs.jump3r
    minecraftLibrary libs.jump3r
    jarJar(libs.jump3r) { dependency -> jarJar.ranged(dependency, '[1.0.5,1.0.6)') }
    javacvFacade("org.bytedeco:javacv:${javaCvVersion}"){transitive=false};compileOnly("org.bytedeco:javacv:${javaCvVersion}"){transitive=false}
    implementation("org.bytedeco:javacpp:${javaCppVersion}") { transitive = false }
    minecraftLibrary("org.bytedeco:javacpp:${javaCppVersion}")
    jarJar("org.bytedeco:javacpp:${javaCppVersion}") { dependency ->
        jarJar.ranged(dependency, '[1.5.14,1.5.15)')
    }
    implementation("org.bytedeco:ffmpeg:${ffmpegVersion}") { transitive = false }
    minecraftLibrary("org.bytedeco:ffmpeg:${ffmpegVersion}")
    jarJar("org.bytedeco:ffmpeg:${ffmpegVersion}") { dependency ->
        jarJar.ranged(dependency, '[8.1.2-1.5.14,8.1.3)')
    }
    ['linux-x86_64', 'linux-arm64', 'windows-x86_64'].each { platform ->
        implementation("org.bytedeco:javacpp:${javaCppVersion}:${platform}") { transitive = false }
        minecraftLibrary("org.bytedeco:javacpp:${javaCppVersion}:${platform}")
        bundledNatives("org.bytedeco:javacpp:${javaCppVersion}:${platform}") { transitive = false }
        jarJar(group: 'org.bytedeco', name: 'javacpp', version: '[1.5.14,1.5.15)', classifier: platform)
        implementation("org.bytedeco:ffmpeg:${ffmpegVersion}:${platform}") { transitive = false }
        minecraftLibrary("org.bytedeco:ffmpeg:${ffmpegVersion}:${platform}")
        bundledNatives("org.bytedeco:ffmpeg:${ffmpegVersion}:${platform}") { transitive = false }
        jarJar(group: 'org.bytedeco', name: 'ffmpeg', version: '[8.1.2-1.5.14,8.1.3)', classifier: platform)
    }
    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.launcher
}

dependencyLocking { lockAllConfigurations() }

sourceSets {
    main {
        java {
            setSrcDirs([file('../../../src/main/java'), file('../common/src/main'), file('src/main')])
            exclude 'stonytark/cinemarr/Cinemarr.java'
            exclude 'stonytark/cinemarr/client/CinemarrClient.java'
            exclude 'stonytark/cinemarr/client/CinemarrClientConfigScreen.java'
            exclude 'stonytark/cinemarr/client/CinemarrScreen.java'
            exclude 'stonytark/cinemarr/config/CinemarrConfig.java'
            exclude 'stonytark/cinemarr/gametest/**'
            exclude 'stonytark/cinemarr/network/CinemarrNetwork.java'
            exclude 'stonytark/cinemarr/network/CinemarrPayloads.java'
            exclude 'stonytark/cinemarr/network/MinecraftWireInput.java'
            exclude 'stonytark/cinemarr/network/MinecraftWireOutput.java'
            exclude 'stonytark/cinemarr/network/VideoPayloads.java'
            exclude 'stonytark/cinemarr/client/VideoVertexEmitter.java'
            exclude 'stonytark/cinemarr/client/VideoResourceLocations.java'
            exclude 'stonytark/cinemarr/screen/ScreenPixelBlock.java'
            exclude 'stonytark/cinemarr/screen/QuickTvBlock.java'
            exclude 'stonytark/cinemarr/screen/TvControllerBlock.java'
            exclude 'stonytark/cinemarr/screen/CinemarrWorldScreens.java'
            exclude 'stonytark/cinemarr/server/CinemarrCommands.java'
            exclude 'stonytark/cinemarr/server/CinemarrServer.java'
            exclude 'stonytark/cinemarr/server/CinemarrSavedData.java'
            exclude 'stonytark/cinemarr/server/CinemarrVideoSavedData.java'
            exclude 'stonytark/cinemarr/registry/CinemarrBlocks.java'
            exclude 'stonytark/cinemarr/registry/CinemarrItems.java'
            exclude 'stonytark/cinemarr/registry/CinemarrCreativeTabs.java'
        }
        resources {
            srcDir file('../../../src/main/resources')
            exclude 'META-INF/neoforge.mods.toml'
            exclude 'fabric.mod.json'
        }
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
sourceSets.test.java.srcDir(file('../../../test-fixtures/java/mc1.20'))
sourceSets.test.resources { srcDir file('../../../test-fixtures'); exclude 'java/**' }
tasks.withType(Test).configureEach { useJUnitPlatform() }

tasks.named('processResources') {
    inputs.property 'version', artifactVersion
    filesMatching('META-INF/mods.toml') { expand version: artifactVersion }
    filesMatching('cinemarr.mixins.json') { filter { it.replace('"JAVA_21"', '"JAVA_17"') } }
}

tasks.named('jar', Jar) {
    archiveClassifier = 'slim'
    manifest.attributes('MixinConfigs': 'cinemarr.mixins.json')
    from('../../../THIRD_PARTY_NOTICES.md') { into('META-INF') }
    from('../../../LICENSE') {
        into('META-INF')
        rename { 'LICENSE-Cinemarr-CC0-1.0.txt' }
    }
    from('../../../LICENSE-LGPL-2.1-or-later.txt') { into('META-INF') }
}

tasks.named('jarJar') {
    archiveFileName = expectedReleaseName
    manifest.attributes('MixinConfigs': 'cinemarr.mixins.json')
    from(project.configurations.bundledNatives) { into('META-INF/jarjar') }
    from('../../../THIRD_PARTY_NOTICES.md') { into('META-INF') }
    from('../../../LICENSE') {
        into('META-INF')
        rename { 'LICENSE-Cinemarr-CC0-1.0.txt' }
    }
    from('../../../LICENSE-LGPL-2.1-or-later.txt') { into('META-INF') }
    finalizedBy('reobfJarJar')
}

tasks.named('build') { dependsOn(tasks.named('jarJar')) }

def releaseArchive = tasks.named('jarJar').flatMap { it.archiveFile }
def releaseEntries = ['META-INF/jarjar/stonytark.cinemarr.core-1.0.0.jar', 'META-INF/jarjar/jlayer-1.0.1.jar',
                      'META-INF/jarjar/jump3r-1.0.5.jar', 'META-INF/jarjar/metadata.json',
                      'org/bytedeco/javacv/FFmpegFrameGrabber.class', 'org/bytedeco/javacv/Frame.class',
                      'META-INF/LICENSE-Cinemarr-CC0-1.0.txt', 'META-INF/LICENSE-LGPL-2.1-or-later.txt',
                      'META-INF/THIRD_PARTY_NOTICES.md', 'META-INF/mods.toml', 'cinemarr.mixins.json',
                      'cinemarr.png', 'pack.mcmeta', 'assets/cinemarr/lang/en_us.json',
                      'stonytark/cinemarr/Cinemarr.class', 'stonytark/cinemarr/client/CinemarrClient.class',
                      'stonytark/cinemarr/network/CinemarrNetwork.class', 'stonytark/cinemarr/network/VideoPayloads.class',
                      'stonytark/cinemarr/client/FfmpegVideoDecoder.class',
                      'stonytark/cinemarr/registry/CinemarrBlocks.class']

tasks.register('verifyRelease') {
    group = 'verification'
    dependsOn(tasks.named('build'), tasks.named('reobfJarJar'))
    doLast {
        def archive = releaseArchive.get().asFile
        if (archive.name != expectedReleaseName) throw new GradleException("Unexpected release filename: ${archive.name}")
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            def found = zip.entries().collect { it.name } as Set
            releaseEntries.each { entry ->
                if (!found.contains(entry)) throw new GradleException("Release archive is missing ${entry}")
            }
            def metadata = zip.getInputStream(zip.getEntry('META-INF/mods.toml')).getText('UTF-8')
            if (!metadata.contains('modId="cinemarr"') || !metadata.contains('versionRange="[1.20.2,1.20.3)"')
                    || !metadata.contains('versionRange="[48.1.0,49)"') || !metadata.contains('displayTest="MATCH_VERSION"')) {
                throw new GradleException('Forge metadata does not enforce the expected mod, Minecraft, and loader versions')
            }
            if (!zip.getInputStream(zip.getEntry('cinemarr.mixins.json')).getText('UTF-8').contains('"JAVA_17"')) {
                throw new GradleException('Forge 1.20.2 mixin metadata does not target Java 17')
            }
            new java.util.zip.ZipInputStream(zip.getInputStream(zip.getEntry('META-INF/jarjar/stonytark.cinemarr.core-1.0.0.jar'))).withCloseable { nested ->
                boolean foundCoreClass = false
                for (def entry = nested.nextEntry; entry != null; entry = nested.nextEntry) {
                    if (entry.name == 'stonytark/cinemarr/core/server/ChunkTransferPolicy.class') {
                        byte[] header = nested.readNBytes(8)
                        int major = ((header[6] & 0xff) << 8) | (header[7] & 0xff)
                        if (major != 52) throw new GradleException("Shared core is not Java 8 bytecode: class major ${major}")
                        foundCoreClass = true
                    }
                }
                if (!foundCoreClass) throw new GradleException('Release archive does not contain the shared transport core')
            }
        }
    }
}

ext.cinemarrReleaseArchiveTask = 'jarJar'
apply from: file('../../../gradle/flatten-video-runtime.gradle')
