plugins {
    id 'java'
    alias(libs.plugins.neogradle.userdev)
}

group = 'stonytark'
version = '1.0.0'
def artifactVersion = version.toString()
def expectedReleaseName = "cinemarr-${artifactVersion}+mc1.20.2-neoforge.jar"
evaluationDependsOn(':core')

base { archivesName = "cinemarr-${artifactVersion}+mc1.20.2-neoforge" }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(libs.versions.java.get().toInteger())
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}

runs {
    configureEach {
        workingDirectory project.file('run')
        modSource sourceSets.main
        dependencies {
            runtime libs.jlayer
            runtime libs.jump3r
            runtime 'org.bytedeco:javacpp:1.5.14'
            runtime 'org.bytedeco:ffmpeg:8.1.2-1.5.14'
            runtime 'org.bytedeco:javacpp:1.5.14:linux-x86_64'
            runtime 'org.bytedeco:ffmpeg:8.1.2-1.5.14:linux-x86_64'
        }
    }
    client {
        arguments '--mixin.config', 'cinemarr.mixins.json'
        if (providers.gradleProperty('cinemarrAcceptanceServer').isPresent()) {
            workingDirectory file(providers.gradleProperty('cinemarrAcceptanceGameDir').get())
            arguments '--username', providers.gradleProperty('cinemarrAcceptanceUsername').get(),
                    '--quickPlayMultiplayer', providers.gradleProperty('cinemarrAcceptanceServer').get()
        }
    }
    server { arguments '--nogui' }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases/' }
}

configurations { javacvFacade }
def extractJavaCvFacade = tasks.register('extractJavaCvFacade', Sync) {
    from { configurations.javacvFacade.collect { zipTree(it) } }
    include 'org/bytedeco/javacv/Frame.class', 'org/bytedeco/javacv/Frame$*.class',
            'org/bytedeco/javacv/FrameGrabber.class', 'org/bytedeco/javacv/FrameGrabber$*.class',
            'org/bytedeco/javacv/FFmpegFrameGrabber.class', 'org/bytedeco/javacv/FFmpegFrameGrabber$*.class',
            'org/bytedeco/javacv/FFmpegLogCallback.class'
    into(layout.buildDirectory.dir('generated/javacvFacade'))
}
sourceSets.main.output.dir(extractJavaCvFacade)

jarJar.enable()
def sharedCoreDependency = dependencies.project(path: ':core')

dependencies {
    def javaCppVersion = '1.5.14'
    def ffmpegVersion = '8.1.2-1.5.14'
    def javaCvVersion = '1.5.14'
    implementation "net.neoforged:neoforge:${libs.versions.neoforge.loader.get()}"
    implementation sharedCoreDependency
    jarJar(sharedCoreDependency)
    jarJar.pin(sharedCoreDependency, '1.0.0')
    jarJar.ranged(sharedCoreDependency, '[1.0.0,1.0.1)')
    implementation libs.jlayer
    jarJar('javazoom:jlayer:[1.0.1,1.0.2)') { version { prefer '1.0.1' } }
    implementation libs.jump3r
    jarJar('de.sciss:jump3r:[1.0.5,1.0.6)') { version { prefer '1.0.5' } }
    javacvFacade("org.bytedeco:javacv:${javaCvVersion}") { transitive = false }
    compileOnly("org.bytedeco:javacv:${javaCvVersion}") { transitive = false }
    jarJar(implementation("org.bytedeco:javacpp:${javaCppVersion}") { transitive = false })
    jarJar(implementation("org.bytedeco:ffmpeg:${ffmpegVersion}") { transitive = false })
    ['linux-x86_64', 'linux-arm64', 'windows-x86_64'].each { platform ->
        jarJar(implementation("org.bytedeco:javacpp:${javaCppVersion}:${platform}") { transitive = false })
        jarJar(implementation("org.bytedeco:ffmpeg:${ffmpegVersion}:${platform}") { transitive = false })
    }
    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.launcher
}

dependencyLocking { lockAllConfigurations() }

sourceSets {
    main {
        java {
            setSrcDirs([file('../../../src/main/java'), file('../common/src/main'), file('src/main')])
            exclude 'stonytark/cinemarr/Cinemarr.java'
            exclude 'stonytark/cinemarr/client/CinemarrClient.java'
            exclude 'stonytark/cinemarr/client/CinemarrClientConfigScreen.java'
            exclude 'stonytark/cinemarr/client/CinemarrScreen.java'
            exclude 'stonytark/cinemarr/config/CinemarrConfig.java'
            exclude 'stonytark/cinemarr/gametest/**'
            exclude 'stonytark/cinemarr/network/CinemarrNetwork.java'
            exclude 'stonytark/cinemarr/network/CinemarrPayloads.java'
            exclude 'stonytark/cinemarr/network/MinecraftWireInput.java'
            exclude 'stonytark/cinemarr/network/MinecraftWireOutput.java'
            exclude 'stonytark/cinemarr/network/VideoPayloads.java'
            exclude 'stonytark/cinemarr/client/VideoVertexEmitter.java'
            exclude 'stonytark/cinemarr/client/VideoResourceLocations.java'
            exclude 'stonytark/cinemarr/screen/ScreenPixelBlock.java'
            exclude 'stonytark/cinemarr/screen/QuickTvBlock.java'
            exclude 'stonytark/cinemarr/screen/TvControllerBlock.java'
            exclude 'stonytark/cinemarr/screen/CinemarrWorldScreens.java'
            exclude 'stonytark/cinemarr/server/CinemarrCommands.java'
            exclude 'stonytark/cinemarr/server/CinemarrServer.java'
            exclude 'stonytark/cinemarr/server/CinemarrSavedData.java'
            exclude 'stonytark/cinemarr/server/CinemarrVideoSavedData.java'
            exclude 'stonytark/cinemarr/registry/CinemarrBlocks.java'
            exclude 'stonytark/cinemarr/registry/CinemarrItems.java'
        }
        resources {
            srcDir file('../../../src/main/resources')
            exclude 'META-INF/neoforge.mods.toml'
            exclude 'fabric.mod.json'
        }
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
sourceSets.test.java.srcDir(file('../../../test-fixtures/java/mc1.20'))
sourceSets.test.resources { srcDir file('../../../test-fixtures'); exclude 'java/**' }
tasks.withType(Test).configureEach { useJUnitPlatform() }

tasks.named('processResources') {
    inputs.property 'version', artifactVersion
    filesMatching('META-INF/mods.toml') { expand version: artifactVersion }
    filesMatching('cinemarr.mixins.json') { filter { it.replace('"JAVA_21"', '"JAVA_17"') } }
}

tasks.named('jar', Jar) {
    archiveClassifier = 'slim'
    manifest.attributes('MixinConfigs': 'cinemarr.mixins.json')
    from('../../../THIRD_PARTY_NOTICES.md') { into('META-INF') }
    from('../../../LICENSE') {
        into('META-INF')
        rename { 'LICENSE-Cinemarr-CC0-1.0.txt' }
    }
    from('../../../LICENSE-LGPL-2.1-or-later.txt') { into('META-INF') }
}

tasks.named('jarJar', Jar) {
    archiveFileName = expectedReleaseName
    manifest.attributes('MixinConfigs': 'cinemarr.mixins.json')
    from('../../../THIRD_PARTY_NOTICES.md') { into('META-INF') }
    from('../../../LICENSE') {
        into('META-INF')
        rename { 'LICENSE-Cinemarr-CC0-1.0.txt' }
    }
    from('../../../LICENSE-LGPL-2.1-or-later.txt') { into('META-INF') }
}

tasks.named('build') { dependsOn(tasks.named('jarJar')) }

def releaseArchive = tasks.named('jarJar').flatMap { it.archiveFile }
def releaseEntries = ['META-INF/LICENSE-Cinemarr-CC0-1.0.txt', 'META-INF/LICENSE-LGPL-2.1-or-later.txt',
                      'META-INF/THIRD_PARTY_NOTICES.md', 'META-INF/mods.toml', 'cinemarr.mixins.json',
                      'cinemarr.png', 'pack.mcmeta', 'assets/cinemarr/lang/en_us.json',
                      'stonytark/cinemarr/Cinemarr.class', 'stonytark/cinemarr/client/CinemarrClient.class',
                      'stonytark/cinemarr/network/CinemarrNetwork.class', 'stonytark/cinemarr/network/VideoPayloads.class',
                      'stonytark/cinemarr/client/FfmpegVideoDecoder.class',
                      'stonytark/cinemarr/registry/CinemarrBlocks.class',
                      'org/bytedeco/javacv/FFmpegFrameGrabber.class', 'org/bytedeco/javacv/Frame.class']

tasks.register('verifyRelease') {
    group = 'verification'
    dependsOn(tasks.named('build'))
    doLast {
        def archive = releaseArchive.get().asFile
        if (archive.name != expectedReleaseName) throw new GradleException("Unexpected release filename: ${archive.name}")
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            def found = zip.entries().collect { it.name } as Set
            releaseEntries.each { entry ->
                if (!found.contains(entry)) throw new GradleException("Release archive is missing ${entry}")
            }
            def nested = found.findAll { it.startsWith('META-INF/jarjar/') && it.endsWith('.jar') }
            ['core', 'jlayer', 'jump3r', 'javacpp', 'ffmpeg'].each { dependency ->
                if (!nested.any { it.toLowerCase(java.util.Locale.ROOT).contains(dependency) }) {
                    throw new GradleException("Release archive does not bundle ${dependency}")
                }
            }
            ['linux-x86_64', 'linux-arm64', 'windows-x86_64'].each { platform ->
                ['javacpp', 'ffmpeg'].each { dependency ->
                    if (!nested.any { it.contains(dependency) && it.contains(platform) }) {
                        throw new GradleException("Release archive does not bundle ${dependency} ${platform}")
                    }
                }
            }
            def metadata = zip.getInputStream(zip.getEntry('META-INF/mods.toml')).getText('UTF-8')
            if (!metadata.contains('modId="cinemarr"') || !metadata.contains('modId="neoforge"')
                    || !metadata.contains('versionRange="[1.20.2,1.20.3)"')
                    || !metadata.contains('versionRange="[20.2.93,20.3)"') || !metadata.contains('displayTest="MATCH_VERSION"')) {
                throw new GradleException('NeoForge metadata does not enforce the expected mod, Minecraft, and loader versions')
            }
            if (!zip.getInputStream(zip.getEntry('cinemarr.mixins.json')).getText('UTF-8').contains('"JAVA_17"')) {
                throw new GradleException('NeoForge 1.20.2 mixin metadata does not target Java 17')
            }
            def coreEntry = nested.find { it.toLowerCase(java.util.Locale.ROOT).contains('core') }
            new java.util.zip.ZipInputStream(zip.getInputStream(zip.getEntry(coreEntry))).withCloseable { coreZip ->
                boolean foundCoreClass = false
                for (def entry = coreZip.nextEntry; entry != null; entry = coreZip.nextEntry) {
                    if (entry.name == 'stonytark/cinemarr/core/server/ChunkTransferPolicy.class') {
                        byte[] header = coreZip.readNBytes(8)
                        int major = ((header[6] & 0xff) << 8) | (header[7] & 0xff)
                        if (major != 52) throw new GradleException("Shared core is not Java 8 bytecode: class major ${major}")
                        foundCoreClass = true
                    }
                }
                if (!foundCoreClass) throw new GradleException('Release archive does not contain the shared transport core')
            }
        }
    }
}
