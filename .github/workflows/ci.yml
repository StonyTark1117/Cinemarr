name: Cinemarr CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    name: Validate target manifest
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.generate.outputs.artifact }}
      expected_artifacts: ${{ steps.generate.outputs.expected_artifacts }}
      expected_runtimes: ${{ steps.generate.outputs.expected_runtimes }}
    steps:
      - uses: actions/checkout@v7
      - id: generate
        name: Generate matrices from gradle/targets.json
        run: |
          python3 scripts/test-target-matrix.py
          python3 scripts/target-matrix.py verify
          python3 scripts/check-source-layout.py
          python3 scripts/verify-release-hygiene.py
          echo "artifact=$(python3 scripts/target-matrix.py artifact-matrix)" >> "$GITHUB_OUTPUT"
          echo "expected_artifacts=$(python3 scripts/target-matrix.py summary | jq -r .artifacts)" >> "$GITHUB_OUTPUT"
          echo "expected_runtimes=$(python3 scripts/target-matrix.py summary | jq -r .runtimes)" >> "$GITHUB_OUTPUT"

  artifact:
    needs: matrix
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.matrix.outputs.artifact) }}
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - name: Install headless audio acceptance dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg iproute2 libasound2-plugins libgl1-mesa-dri libopenal1 pulseaudio pulseaudio-utils x11-xserver-utils xvfb
          pulseaudio --start --exit-idle-time=-1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'
          cache: gradle
      - name: Record Java 26 home
        run: echo "CINEMARR_JAVA26_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Record Java 21 home
        run: echo "CINEMARR_JAVA21_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - name: Build and inspect artifact
        run: bash scripts/run-gradle-download-retry.sh ./gradlew ${{ matrix.task }} --no-daemon --max-workers=1
      - name: Verify byte-identical rebuild
        env:
          CINEMARR_ARTIFACT_PATH: ${{ matrix.artifact }}
          CINEMARR_MATRIX_TASK: ${{ matrix.task }}
        run: |
          snapshot="$RUNNER_TEMP/cinemarr-first-build.jar"
          cp -- "$CINEMARR_ARTIFACT_PATH" "$snapshot"
          bash scripts/run-gradle-download-retry.sh \
            ./gradlew "$CINEMARR_MATRIX_TASK" --rerun-tasks --no-daemon --max-workers=1
          cmp -- "$snapshot" "$CINEMARR_ARTIFACT_PATH"
          sha256sum "$CINEMARR_ARTIFACT_PATH"
      - name: Warm Fabric client assets
        if: ${{ matrix.quilt != '' }}
        env:
          CINEMARR_ARTIFACT_PATH: ${{ matrix.artifact }}
          CINEMARR_MATRIX_NAME: ${{ matrix.name }}
        run: |
          target_dir="${CINEMARR_ARTIFACT_PATH%/build/libs/*}"
          java_home="$CINEMARR_JAVA21_HOME"
          if [[ "$CINEMARR_MATRIX_NAME" == 26.* ]]; then
            java_home="$CINEMARR_JAVA26_HOME"
          fi
          for attempt in 1 2; do
            if (
              cd "$target_dir"
              JAVA_HOME="$java_home" PATH="$java_home/bin:$PATH" \
                ./gradlew downloadAssets --no-daemon --max-workers=1
            ); then
              exit 0
            fi
            if [[ "$attempt" == 2 ]]; then
              exit 1
            fi
            echo "Fabric client asset download failed once; retrying with the populated cache."
            sleep 15
          done
      - name: Warm NeoForge 1.20.2 runtime assets
        if: ${{ matrix.name == '1.20.2-neoforge' }}
        run: |
          cd platforms/mc1.20.2/neoforge
          for attempt in 1 2; do
            if timeout --foreground 900s ./gradlew neoFormJoined1.20.2-20231019.002635DownloadAssets \
                --no-daemon --max-workers=1 --no-configuration-cache; then
              exit 0
            fi
            if [[ "$attempt" == 2 ]]; then
              exit 1
            fi
            echo "NeoForm asset download failed once; retrying with the populated cache."
            sleep 15
          done
      - name: Upload verified artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-jar-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
      - name: Run GameTests
        if: ${{ matrix.game_tests }}
        run: bash scripts/run-gametest-gate.sh
      - name: Validate ${{ matrix.runtime }} runtime
        env:
          CINEMARR_ALSA_PCM_TYPE: pulse
          CINEMARR_PROTOCOL_CLIENT_GATE: 'true'
          CINEMARR_COMMAND_CLIENT_GATE: 'true'
          CINEMARR_VIDEO_CLIENT_GATE: 'true'
        run: bash scripts/run-dedicated-server-gate.sh ${{ matrix.runtime }}
      - name: Validate ${{ matrix.quilt }} runtime
        if: ${{ matrix.quilt != '' }}
        env:
          CINEMARR_ALSA_PCM_TYPE: pulse
          CINEMARR_GATE_OUTPUT_ROOT: ${{ github.workspace }}/build/quilt-gate
          CINEMARR_PROTOCOL_CLIENT_GATE: 'true'
          CINEMARR_COMMAND_CLIENT_GATE: 'true'
          CINEMARR_VIDEO_CLIENT_GATE: 'true'
        run: bash scripts/run-dedicated-server-gate.sh ${{ matrix.quilt }}
      - name: Validate ${{ matrix.quilt }} with Mod Menu
        if: ${{ matrix.quilt != '' }}
        env:
          CINEMARR_ALSA_PCM_TYPE: pulse
          CINEMARR_GATE_OUTPUT_ROOT: ${{ github.workspace }}/build/quilt-modmenu-gate
          CINEMARR_QUILT_MODMENU_GATE: 'true'
          CINEMARR_PROTOCOL_CLIENT_GATE: 'true'
          CINEMARR_COMMAND_CLIENT_GATE: 'true'
          CINEMARR_VIDEO_CLIENT_GATE: 'true'
        run: bash scripts/run-dedicated-server-gate.sh ${{ matrix.quilt }}
      - name: Validate minimum Fabric Loader
        if: ${{ matrix.quilt != '' }}
        env:
          CINEMARR_ALSA_PCM_TYPE: pulse
          CINEMARR_GATE_OUTPUT_ROOT: ${{ github.workspace }}/build/fabric-loader-0.19.2-gate
          CINEMARR_FABRIC_LOADER_VERSION: 0.19.2
        run: bash scripts/run-dedicated-server-gate.sh ${{ matrix.runtime }}
      - name: Upload runtime diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: runtime-diagnostics-${{ matrix.name }}-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            build/dedicated-server-gate/**/*.log
            build/dedicated-server-gate/**/*.txt
            build/dedicated-server-gate/**/*.json
            build/dedicated-server-gate/**/*.tsv
            build/dedicated-server-gate/**/*.s16le
            build/quilt-gate/**/*.log
            build/quilt-gate/**/*.txt
            build/quilt-gate/**/*.json
            build/quilt-gate/**/*.tsv
            build/quilt-gate/**/*.s16le
            build/quilt-modmenu-gate/**/*.log
            build/quilt-modmenu-gate/**/*.txt
            build/quilt-modmenu-gate/**/*.json
            build/quilt-modmenu-gate/**/*.tsv
            build/quilt-modmenu-gate/**/*.s16le
            build/fabric-loader-0.19.2-gate/**/*.log
            build/fabric-loader-0.19.2-gate/**/*.txt
            build/fabric-loader-0.19.2-gate/**/*.json
            build/fabric-loader-0.19.2-gate/**/*.tsv
            build/gametest-gate.log

  release-gate:
    name: 1.0 release gate
    needs: [matrix, artifact]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Download all verified artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-jar-*
          path: build/prebuilt-release
          merge-multiple: true
      - name: Assemble and inspect release bundle
        env:
          EXPECTED_ARTIFACTS: ${{ needs.matrix.outputs.expected_artifacts }}
          EXPECTED_RUNTIMES: ${{ needs.matrix.outputs.expected_runtimes }}
        run: |
          test "$EXPECTED_ARTIFACTS" -eq 16
          test "$EXPECTED_RUNTIMES" -eq 21
          test "$(find build/prebuilt-release -maxdepth 1 -type f -name '*.jar' | wc -l)" -eq "$EXPECTED_ARTIFACTS"
          ./gradlew indexReleaseArtifacts -PcinemarrPrebuiltArtifactDir=build/prebuilt-release --no-daemon --max-workers=1
          python3 scripts/inspect-release-artifacts.py build/releases
          (cd build/releases && sha256sum -c SHA256SUMS)
      - name: Upload verified CI bundle
        uses: actions/upload-artifact@v7
        with:
          name: cinemarr-1.0.0-ci-bundle-${{ github.sha }}
          path: build/releases
          if-no-files-found: error
          retention-days: 14
