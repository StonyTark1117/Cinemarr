    description = 'Creates a portable Linux/Windows decoder benchmark bundle without Minecraft runtime jars.'
    dependsOn(testClasses, project(':core').tasks.named('jar'), tasks.named('generateDecoderBenchmarkFixtures'))
    into(layout.buildDirectory.dir('decoder-benchmark/bundle'))
