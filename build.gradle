plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.143'
}

allprojects {
    apply from: rootProject.file('gradle/reproducible-archives.gradle')
}

import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.security.MessageDigest

def targetManifest = new JsonSlurper().parse(layout.projectDirectory.file('gradle/targets.json').asFile)
if (targetManifest.schemaVersion != 1 || targetManifest.product != 'Cinemarr') {
    throw new GradleException('Unsupported Cinemarr target manifest')
}

version = mod_version
group = mod_group_id

repositories {
    mavenCentral()
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            if (providers.gradleProperty('cinemarrAcceptanceServer').isPresent()) {
                gameDirectory = file(providers.gradleProperty('cinemarrAcceptanceGameDir').get())
                programArguments.addAll '--username', providers.gradleProperty('cinemarrAcceptanceUsername').get(),
                        '--quickPlayMultiplayer', providers.gradleProperty('cinemarrAcceptanceServer').get()
                if (providers.gradleProperty('cinemarrAcceptanceWidth').isPresent()) {
                    programArguments.addAll '--width', providers.gradleProperty('cinemarrAcceptanceWidth').get(),
                            '--height', providers.gradleProperty('cinemarrAcceptanceHeight').get()
                }
            }
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = layout.buildDirectory.dir('run-gametest').get().asFile
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

