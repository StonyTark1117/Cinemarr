def emptyGameTestInput = layout.projectDirectory.file('gradle/empty-gametest.nbt.b64')
def emptyGameTestOutput = layout.buildDirectory.dir('generated/gametestResources')
var generateGameTestTemplate = tasks.register('generateGameTestTemplate') {
    inputs.file(emptyGameTestInput)
    outputs.dir(emptyGameTestOutput)
    doLast {
        def inputFile = inputs.files.singleFile
        def outputFile = new File(outputs.files.singleFile, 'data/cinemarr/structure/empty.nbt')
        outputFile.parentFile.mkdirs()
        outputFile.bytes = java.util.Base64.getDecoder().decode(inputFile.text.trim())
    }
}
sourceSets.main.resources.srcDir(generateGameTestTemplate)

configurations { javacvFacade }
def extractJavaCvFacade = tasks.register('extractJavaCvFacade', Sync) {
    from { configurations.javacvFacade.collect { zipTree(it) } }
    include 'org/bytedeco/javacv/Frame.class', 'org/bytedeco/javacv/Frame$*.class',
            'org/bytedeco/javacv/FrameGrabber.class', 'org/bytedeco/javacv/FrameGrabber$*.class',
            'org/bytedeco/javacv/FFmpegFrameGrabber.class', 'org/bytedeco/javacv/FFmpegFrameGrabber$*.class',
            'org/bytedeco/javacv/FFmpegLogCallback.class'
    into(layout.buildDirectory.dir('generated/javacvFacade'))
}
// JavaCV's module descriptor requires every optional capture backend. Embed
// only the Apache-licensed FFmpeg facade classes instead, keeping those
// unrelated modules off both clients and dedicated servers.
sourceSets.main.output.dir(extractJavaCvFacade)

dependencies {
    def javaCppVersion = '1.5.14'
    def ffmpegVersion = '8.1.2-1.5.14'
    def javaCvVersion = '1.5.14'
    jarJar(implementation(project(':core')))
    additionalRuntimeClasspath(project(':core'))
    neoForgeTestLibraries(project(':core'))
    // NeoForge 1.21.1 does not expose ordinary Java libraries to the
    // dedicated development run unless they are added to this classpath.
    // The ordinary (non -gpl) FFmpeg preset is LGPL. Keep every component
    // explicit so an all-platform or GPL-enabled artifact cannot enter the
    // release transitively.
    javacvFacade("org.bytedeco:javacv:${javaCvVersion}") { transitive = false }
    compileOnly("org.bytedeco:javacv:${javaCvVersion}") { transitive = false }
    jarJar(implementation("org.bytedeco:javacpp:${javaCppVersion}") { transitive = false })
    jarJar(implementation("org.bytedeco:ffmpeg:${ffmpegVersion}") { transitive = false })
    ['linux-x86_64', 'linux-arm64', 'windows-x86_64'].each { platform ->
        jarJar(implementation("org.bytedeco:javacpp:${javaCppVersion}:${platform}") { transitive = false })
        jarJar(implementation("org.bytedeco:ffmpeg:${ffmpegVersion}:${platform}") { transitive = false })
        additionalRuntimeClasspath("org.bytedeco:javacpp:${javaCppVersion}:${platform}")
        additionalRuntimeClasspath("org.bytedeco:ffmpeg:${ffmpegVersion}:${platform}")
    }
    additionalRuntimeClasspath("org.bytedeco:javacpp:${javaCppVersion}") { transitive = false }
    additionalRuntimeClasspath("org.bytedeco:ffmpeg:${ffmpegVersion}") { transitive = false }
    testImplementation(platform('org.junit:junit-bom:5.10.2'))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

