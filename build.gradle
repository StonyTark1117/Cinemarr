            '--classifier', providers.gradleProperty('cinemarrDecoderClassifier').orElse('').get(),
            '--minecraft-profile', providers.gradleProperty('cinemarrDecoderMinecraftProfile').orElse('standalone').get(),
            '--gpu-utilization', providers.gradleProperty('cinemarrDecoderGpuUtilization').orElse('').get(),
            '--fixture-dir', providers.gradleProperty('cinemarrDecoderFixtureDir').orElse('').get(),
