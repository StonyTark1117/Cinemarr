// The release orchestrator invokes each maintained target through its own
// wrapper. Propagate a root --rerun-tasks request into those child Gradle
// builds; otherwise a purported reproducibility rebuild can reuse the first
// build's target outputs while only re-running this outer Exec task.
def releaseGateNames = { target ->
    List<String> names = [target.task as String]
    if (target.quiltRuntime != null) names.add((target.task as String).replace('verifyFabric', 'verifyQuilt'))
    names
}
// Keep the Java-8 legacy toolchain last because its isolated build owns its
// core compilation. Membership comes from the same manifest as CI/indexing.
def isolatedTargets = targetManifest.artifacts.findAll { it.path != '.' }
        .sort { a, b -> (a.runtimeJava == 8 ? 1 : 0) <=> (b.runtimeJava == 8 ? 1 : 0) }
def isolatedGradleReleaseGates = isolatedTargets.collectMany(releaseGateNames).collect { tasks.named(it) }
if (gradle.startParameter.rerunTasks) {
    isolatedGradleReleaseGates.each { gate ->
        gate.configure { args '--rerun-tasks' }
    }
}

def verifyGameTests = tasks.register('verifyGameTests', Exec) {
    group = 'verification'
    description = 'Runs NeoForge GameTests and cleans up a successful lingering server process.'
    workingDir(layout.projectDirectory)
    commandLine('bash', 'scripts/run-gametest-gate.sh')
}

// All isolated builds include the same physical core project but use several
// Gradle versions. Compile that shared output once in this owning build, then
// keep child builds read-only with respect to core/classes. Otherwise a child
// can snapshot the classpath while another Gradle version is replacing it.
isolatedTargets.findAll { it.runtimeJava != 8 }.collectMany(releaseGateNames).each { taskName ->
    def targetTask = tasks.named(taskName)
    targetTask.configure {
        dependsOn project(':core').tasks.named('classes')
        args '-x', ':core:compileJava'
    }
}

// Run the shared core suite once in the owning root build. Nested loader builds
// use different Gradle versions but share core/build; asking each of them to
// rewrite binary test results makes otherwise-serial family gates nondeterministic.
isolatedGradleReleaseGates.each { isolatedGate ->
    isolatedGate.configure { dependsOn(':core:test') }
}

// Every isolated build uses the same checked-out core/build directory. Keep the
// family boundaries serialized as well as the loaders within each family so
// cleanTest/core:jar cannot remove or replace files while another JVM is using
// them.
isolatedGradleReleaseGates.eachWithIndex { gate, index ->
    if (index > 0) gate.configure { mustRunAfter(isolatedGradleReleaseGates[index - 1]) }
}
verifyGameTests.configure { mustRunAfter(isolatedGradleReleaseGates, tasks.named('verifyRelease')) }

def familyReleaseGates = targetManifest.artifacts.groupBy { it.minecraft }.collect { minecraft, targets ->
    tasks.register("verify${minecraft.replace('.', '')}Family") {
        group = 'verification'
        description = "Builds and verifies every manifest target for Minecraft ${minecraft}."
        dependsOn(':core:test', targets.collectMany(releaseGateNames).collect { tasks.named(it) })
    }
}

tasks.register('verifyAllTargets') {
    group = 'verification'
    description = 'Builds and verifies every currently registered Cinemarr target.'
    dependsOn(familyReleaseGates, verifyGameTests)
}

